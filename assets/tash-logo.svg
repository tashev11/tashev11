<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">TASH</title>
  <desc id="desc">Modern metallic TASH coin logo</desc>
  <defs>
    <radialGradient id="blue" cx="42%" cy="30%" r="78%">
      <stop offset="0" stop-color="#0f66dd"/>
      <stop offset="0.48" stop-color="#073d98"/>
      <stop offset="1" stop-color="#031a4d"/>
    </radialGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.2" stop-color="#9aa9ba"/>
      <stop offset="0.43" stop-color="#ffffff"/>
      <stop offset="0.65" stop-color="#8d9bab"/>
      <stop offset="0.84" stop-color="#eef4fb"/>
      <stop offset="1" stop-color="#6f7d8c"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#bac6d2"/>
      <stop offset="1" stop-color="#697887"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#00143a" flood-opacity=".72"/>
    </filter>
  </defs>
  <circle cx="256" cy="256" r="231" fill="url(#blue)" stroke="url(#silver)" stroke-width="22"/>
  <circle cx="256" cy="256" r="215" fill="none" stroke="#091a38" stroke-width="3" opacity=".9"/>
  <circle cx="256" cy="256" r="207" fill="none" stroke="#17a9ff" stroke-width="4" filter="url(#glow)"/>
  <path d="M132 143H380V211H305V374H337V419H175V374H207V211H132Z" fill="url(#silver)" stroke="#506174" stroke-width="3" stroke-linejoin="miter" filter="url(#shadow)"/>
  <path d="M146 157H366V194H289V386H318V402H194V386H223V194H146Z" fill="none" stroke="url(#edge)" stroke-width="7" opacity=".9"/>
  <path d="M145 151H369" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity=".82"/>
  <path d="M216 217V367" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity=".42"/>
</svg>
